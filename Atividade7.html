<!DOCTYPE html>
    <html>
        <head>
            <title>Atividade 7</title>
        </head>
        <body>
            <main>
                <section>
                    <p><b>Lista não ordenada</b></p>
                    <ul type="disc">
                        <li>Item um</li>
                        <li>Item dois</li>
                    </ul>
                </section>
                <section>
                    <ul type="circle">
                        <li>Item um</li>
                        <li>Item dois</li>
                    </ul>
                </section>
                <section>
                    <ul type="square">
                        <li>Item um</li>
                        <li>Item dois</li>
                    </ul>
                </section>
                <section>
                    <p><b>Lista ordenada</b></p>
                    <ol>
                        <li>Item um</li>
                        <li>Item dois</li>
                        <li value="5">Item cinco</li>
                        <li>Item três?</li>
                    </ol>
                </section>
            </main>
        </body>
    </html>
